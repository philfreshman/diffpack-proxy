name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy and smoke test
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for secret in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error title=Missing secret ${secret}::The repository secret ${secret} is not set, so the proxy cannot be deployed. Add it as described under \"First deploy\" in docs/operations.md, then re-run this workflow."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun

      - name: Wait for the Worker to answer
        env:
          PROXY_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$PROXY_ORIGIN" ]; then
            echo "::error title=No deployment URL::wrangler deploy reported no workers.dev address. Check that the account has a workers.dev subdomain and that wrangler.jsonc has no routes."
            exit 1
          fi
          echo "Deployed to $PROXY_ORIGIN" >>"$GITHUB_STEP_SUMMARY"
          curl --silent --show-error --fail --output /dev/null \
            --retry 12 --retry-delay 10 --retry-all-errors --max-time 30 \
            "$PROXY_ORIGIN/v1/health"

      - name: Smoke test
        env:
          PROXY_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
        run: scripts/smoke.sh "$PROXY_ORIGIN"
