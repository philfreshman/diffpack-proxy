[install]
# Only resolve npm versions published at least 14 days ago (in seconds), including transitive ones.
# Matches Renovate's minimumReleaseAge in renovate.json.
minimumReleaseAge = 1209600
minimumReleaseAgeExcludes = [
	"vite-plus",
	"@voidzero-dev/vite-plus-core",
	"vitest",
	"oxlint",
	"oxfmt",
	"tsrs",
	"@oxlint/plugins",
	"@oxc-project/types",
	"@oxc-project/runtime",
	"@vitest/spy",
	"@vitest/utils",
	"@vitest/mocker",
	"@vitest/browser",
	"@vitest/snapshot",
	"@vitest/pretty-format",
	"@vitest/browser-preview",
	"@vitest/ui",
	"@voidzero-dev/vite-plus-darwin-x64",
	"@voidzero-dev/vite-plus-darwin-arm64",
	"@voidzero-dev/vite-plus-linux-x64-gnu",
	"@voidzero-dev/vite-plus-linux-x64-musl",
	"@voidzero-dev/vite-plus-win32-x64-msvc",
	"@voidzero-dev/vite-plus-linux-arm64-gnu",
	"@voidzero-dev/vite-plus-linux-arm64-musl",
	"@voidzero-dev/vite-plus-win32-arm64-msvc",
	"@oxlint/binding-darwin-x64",
